name: radar

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      # state.json + feed.json live on the orphan `data` branch, one commit, force-pushed every run
      - name: Load radar memory
        run: |
          mkdir -p data
          if git fetch -q --depth 1 origin data; then
            git show FETCH_HEAD:state.json > data/state.json
            git show FETCH_HEAD:feed.json > data/feed.json
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tick
        env:
          SORSA_API_KEY: ${{ secrets.SORSA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          RADAR_LIST_ID: ${{ vars.RADAR_LIST_ID }}
          RADAR_FEED_URL: ${{ vars.RADAR_FEED_URL }}
        run: python -m radar.run --data data

      - name: Save radar memory
        if: always()
        run: |
          cd data
          git init -q -b data
          git add state.json feed.json
          git -c user.name=radar -c user.email=radar@users.noreply.github.com commit -qm "data $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
